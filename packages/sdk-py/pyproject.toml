[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "howest-resto"
version = "1.0.0"
description = "Multi-language client SDK for Howest student restaurant menus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mauro Druwel", email = "mauro@druwel.be" }]
keywords = ["howest", "resto", "menu", "sdk", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MauroDruwel/howest-resto-forge"

[tool.ruff]
line-length = 100
target-version = "py311"
