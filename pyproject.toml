[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "howest-resto"
version = "1.0.0"
description = "Official typed Python client library for Howest student restaurant menus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mauro Druwel", email = "mauro.druwel@gmail.com" }
]
keywords = ["howest", "resto", "menu", "home-assistant", "scraper", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/MauroDruwel/howest-resto"
Repository = "https://github.com/MauroDruwel/howest-resto"
Documentation = "https://github.com/MauroDruwel/howest-resto"
"Issue Tracker" = "https://github.com/MauroDruwel/howest-resto/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
